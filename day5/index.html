<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <script src="users.js" defer></script>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
        label { display: block; font-weight: bold; margin: 16px 0 4px; }
        input { padding: 8px; width: 100%; box-sizing: border-box; font-size: 1rem; }
        button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
        #users-list { list-style: none; padding: 0; }
        .user-card { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
        .user-card h2 { margin: 0 0 4px; font-size: 1.1rem; }
        .user-card p { margin: 0; color: #444; }
        .error { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

    <h1>User Directory</h1>

    <button id="load-users" type="button">Load users</button>

    <label for="filter-input">Filter by name</label>
    <input type="text" id="filter-input" placeholder="Type a name...">

    <p id="status"></p>
    <ul id="users-list"></ul>

</body>
</html>
